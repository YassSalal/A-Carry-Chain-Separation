
# Replacement for .github/workflows/verify-fpga-tables.yml
name: verify-fpga-tables
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Manifest hashes match the committed reports
        run: cd Supp.F/fpga_reports && sha256sum -c SHA256SUMS
      - name: Collated CSV is reproduced exactly from the raw reports
        run: |
          python Supp.F/fpga_reports/scripts/collect_reports.py collate Supp.F/fpga_reports/raw /tmp/collated
          diff <(cut -d, -f1-19 /tmp/collated/fpga_results.csv) <(cut -d, -f1-19 Supp.F/fpga_reports/collated/fpga_results.csv)
